#build from github actions -> pass artifcat to server
name: Deploy To EC2

on:
  push:
    branches:
      - main

jobs:
  My-Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: create application.yml
        run: |
          pwd
          mkdir ./src/main/resources
          echo "${{secrets.APPLICATION_PROPERTIES}}" > ./src/main/resources/application.yml

      - name: Test and Build
        run: ./gradlew clean build

      - name: change jar name
        run: mv ./build/libs/*SNAPSHOT.jar ./project.jar

      - name: Send built file to EC2 through SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{secrets.EC2_HOST }}
          username: ${{secrets.EC2_USERNAME }}
          key: ${{secrets.EC2_PRIVATE_KEY }}
          source: project.jar
          target: /home/ubuntu/test-server/tobe


      - name: Access EC2 Instance through SSH(remote)
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{secrets.EC2_HOST }}
          username: ${{secrets.EC2_USERNAME }}
          key: ${{secrets.EC2_PRIVATE_KEY }}

          script_stop: true
          script: |
            rm -rf /home/ubuntu/test-server/current
            mkdir /home/ubuntu/test-server/current
            mv /home/ubuntu/test-server/tobe/project.jar /home/ubuntu/test-server/current/project.jar
            cd /home/ubuntu/test-server/current
            sudo fuser -k -n tcp 8080 || true
            nohup java -jar project.jar >> result.log 2>&1 &
            rm -rf /home/ubuntu/test-server/tobe
   

     
  
